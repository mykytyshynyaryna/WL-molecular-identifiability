[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wl-identifiability"
version = "0.1.0"
description = "1-WL identifiability analysis pipeline for molecular graphs (ZINC dataset)"
requires-python = ">=3.12"

dependencies = [
    "networkx>=3.3",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "polars>=1.0",
    "rdkit>=2024.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wl_identifiability"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
run-pipeline = "examples.run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long, handled by formatter
    "SIM108", # ternary operator is sometimes less readable
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true
no_site_packages = true