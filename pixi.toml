[workspace]
name = "wl-identifiability"
version = "0.1.0"
description = "1-WL identifiability analysis pipeline for molecular graphs (ZINC dataset)"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# ---------------------------------------------------------------------------
# Runtime dependencies (all from conda-forge so rdkit resolves correctly)
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.10,<3.13"
networkx = "3.3.*"
numpy = "1.26.*"
matplotlib-base = "3.9.*"
polars = "1.38.*"
rdkit = "2025.9.*"

# ---------------------------------------------------------------------------
# Development dependencies (linting, formatting, testing, type-checking)
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.4"
mypy = ">=1.10"

# The package itself — installed as editable so imports resolve to source
[feature.dev.pypi-dependencies]
wl-identifiability = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
[feature.dev.tasks]
test     = "pytest tests/ -v --tb=short"
lint     = "ruff check src/wl_identifiability/ tests/"
format   = "ruff format src/wl_identifiability/ tests/"
typecheck = "mypy src/wl_identifiability/ --no-site-packages"

# ---------------------------------------------------------------------------
# Default environment includes dev features
# ---------------------------------------------------------------------------
[environments]
default = { features = ["dev"], solve-group = "default" }
