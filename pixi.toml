[workspace]
name = "wl-identifiability"
version = "0.1.0"
description = "1-WL identifiability analysis pipeline for molecular graphs (ZINC dataset)"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# ---------------------------------------------------------------------------
# Runtime dependencies (all from conda-forge so rdkit resolves correctly)
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.12,<3.13"
networkx = "3.3.*"
numpy = "1.26.*"
matplotlib-base = "3.9.*"
polars = "1.38.*"
rdkit = "2025.9.*"

# ---------------------------------------------------------------------------
# Development dependencies (linting, formatting, testing, type-checking)
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
pixi-pycharm = ">=0.0.9,<0.0.10"
pytest = ">=8,<9"
pytest-cov = ">=5,<6"
ruff = ">=0.11,<1"
mypy = ">=1.10,<2"

# The package itself — installed as editable so imports resolve to source
[feature.dev.pypi-dependencies]
wl-identifiability = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
[feature.dev.tasks]
test      = "pytest tests/"
lint      = "ruff check src/wl_identifiability/ tests/ scripts/ examples/"
fmt       = "ruff format src/wl_identifiability/ tests/ scripts/ examples/"
typecheck = "mypy src/wl_identifiability/"

# ---------------------------------------------------------------------------
# Default environment includes dev features
# ---------------------------------------------------------------------------
[environments]
default = { features = ["dev"], solve-group = "default" }
